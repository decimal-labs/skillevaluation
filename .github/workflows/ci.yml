name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + types + schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check skillevaluation tests
      - name: Mypy (strict)
        run: mypy skillevaluation
      - name: Validate eval.yaml JSON Schema (draft 2020-12)
        run: python -c "import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('schemas/eval-yaml.schema.json'))); print('schema OK')"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Pytest (unit + conformance suite)
        run: pytest

  windows:
    # ADVISORY, and deliberately so. PR #7's review reported 23 failures on Windows and
    # this repo's CI has only ever run ubuntu — so the package's Windows behaviour was
    # unknown rather than good, and a reader on Windows found out by running it. This job
    # makes the state visible without pretending the platform is supported: it does not
    # block a merge (`continue-on-error`), and README's supported-platforms line says the
    # same thing in words.
    #
    # Turn this into a blocking job the day Windows is supported. Deleting it instead
    # would put the repo back to not knowing.
    name: Tests on Windows (advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Pytest (advisory — failures here do not block)
        run: pytest

  floors:
    # The version floors in pyproject.toml are claims; this job is what makes them
    # true. It installs the LOWEST version of every direct dependency and runs the
    # suite against it. Added 2026-08-17, after the same job on decimalai-python
    # caught a `click>=8.0` floor that was false by two minor versions.
    # Advisory until it has been green for a week, then promote to required.
    name: Floors resolve and pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v5

      - name: Install at the lowest declared versions
        run: uv pip install --system --resolution lowest-direct ".[dev]"

      - name: Show what resolved
        run: uv pip list --system

      - name: The floors are claims — run them
        run: python -m pytest tests -q

  audit:
    # Known-advisory check against the resolved dependency set. Advisory: a new
    # advisory lands on someone else's schedule and should not turn main red
    # before anyone has read it.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and auditor
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit .

      - name: Audit
        run: pip-audit --progress-spinner off
