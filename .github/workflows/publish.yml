name: Publish to PyPI

# Triggers when a release is published in GitHub. Tag conventions:
#   v0.1.0 → publishes skillevaluation 0.1.0 to PyPI
#
# Uses Trusted Publisher (OIDC) — no API token needed.
# Configure once at https://pypi.org/manage/account/publishing/ with:
#   project: skillevaluation
#   owner: decimal-labs
#   repo: skillevaluation
#   workflow: publish.yml
#   environment: pypi

on:
  release:
    types: [published]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Permissions are declared per job, never workflow-wide: a workflow-level
    # `id-token: write` is inherited by EVERY job, and this one runs
    # `pip install -e ".[dev]"` — arbitrary install-time and import-time code from
    # every transitive dev dependency. That code must not be able to mint a PyPI
    # Trusted-Publisher token. Only the publish job below gets id-token.
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publisher (OIDC). Scoped to this job only.
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject.toml=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Publish to PyPI
        # Pinned to a commit SHA rather than the mutable @release/v1 branch ref. This job
        # holds OIDC id-token:write → PyPI publish authority, so a mutable ref would run
        # whatever HEAD of that branch is at publish time. Dependabot maintains the pin.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
